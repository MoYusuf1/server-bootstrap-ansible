name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # No VM in CI: this job checks the code, not a server. The real run is in the README results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make check
