---
# The values you are most likely to change. Each role has the rest in roles/<role>/defaults/main.yml.

# The admin user the playbook creates. Ansible logs in as this user after the first run.
users_name: deploy

# Your PUBLIC key on this machine. Never put a private key in this repo.
users_ssh_public_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_ed25519.pub"

common_timezone: America/Chicago

# Only SSH is open. Add a port here only when something on the server must be reached.
firewall_allowed_tcp_ports:
  - 22

# Users who can run docker without sudo. The docker group is the same as root, so keep this short.
docker_users:
  - "{{ users_name }}"
